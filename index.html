<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя неделя</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Неделя">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">

<style>
:root{
  color-scheme:light;
  --bg:#F2F3EF; --card:#FFFFFF; --ink:#1B2127; --muted:#5C6670; --line:#DCE0DA; --soft:#E8EAE5;
  --uni:#4655CF; --road:#9AA3AD; --gym:#DA4F2B; --pool:#1692BD; --food:#C98E12;
  --study:#23905F; --rest:#8E78C4; --chores:#A95D84; --sleep:#3E4B5D; --drive:#C7348A; --other:#6F7C87;
  --accent:#DA4F2B; --danger:#C2352A;
  --p1:#D93A2F; --p2:#E09A12; --p3:#3C8FD6;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111417; --card:#1A1E22; --ink:#E6E9EB; --muted:#98A1A9; --line:#2A3036; --soft:#23282D;
    --uni:#7D89F0; --road:#79828C; --gym:#F07651; --pool:#43B8DE; --food:#E3AE3C;
    --study:#4CC08A; --rest:#AE9BE3; --chores:#D286AC; --sleep:#8795AB; --drive:#EC6DB6; --other:#9AA6B0;
    --accent:#F07651; --danger:#F0695C; --p1:#F2665A; --p2:#EDB43E; --p3:#6AAEEA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111417; --card:#1A1E22; --ink:#E6E9EB; --muted:#98A1A9; --line:#2A3036; --soft:#23282D;
  --uni:#7D89F0; --road:#79828C; --gym:#F07651; --pool:#43B8DE; --food:#E3AE3C;
  --study:#4CC08A; --rest:#AE9BE3; --chores:#D286AC; --sleep:#8795AB; --drive:#EC6DB6; --other:#9AA6B0;
  --accent:#F07651; --danger:#F0695C; --p1:#F2665A; --p2:#EDB43E; --p3:#6AAEEA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:19px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:650;padding:6px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:650;position:relative}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.weeknav>button{background:none;border:0;font-size:24px;padding:2px 12px;color:var(--ink)}
.weeknav .wklabel{font-size:15px;font-weight:700;padding:6px 8px;border-radius:10px}
.days .dnum{font-size:17px;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums}
.days .dots{display:flex;gap:3px;justify-content:center;min-height:6px;margin-top:2px}
.days .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.days button span{font-size:10.5px;font-weight:500;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.days button.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.ev{display:grid;grid-template-columns:86px 4px 1fr auto;gap:12px;padding:11px 14px;width:100%;text-align:left;background:none;border:0;align-items:start}
.ev .t{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:2px;white-space:nowrap}
.ev .bar{align-self:stretch;border-radius:2px;background:var(--c)}
.ev .what{font-weight:600}
.ev.big .what{font-weight:750}
.ev .note{font-size:13px;color:var(--muted);margin-top:1px}
.ev .chev{color:var(--muted);font-size:18px;line-height:1;padding-top:1px;opacity:.6}
.ev.cur{background:var(--soft)}
.ev.cur .t{color:var(--ink)}
.nowtag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);margin-left:6px;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0;display:grid;place-items:center}
.check.on{background:var(--study);border-color:var(--study)}
.check.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.task .txt{background:none;border:0;text-align:left;padding:0}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task .due{font-size:12px;color:var(--muted)}
.task .due.late{color:var(--danger);font-weight:650}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px;line-height:1}
.group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px -6px}
.addtask{display:grid;grid-template-columns:1fr auto;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:650;color:var(--muted)}
input[type=text],input[type=time],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:220px;resize:vertical;font-family:var(--mono);font-size:14px;line-height:1.5}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.plans .ev{grid-template-columns:4px 1fr auto}
.md h3{font-size:16px;margin:16px 0 6px}
.md h3:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul,.md ol{margin:4px 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.md b{font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow:auto;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet .head{display:flex;gap:12px;align-items:flex-start}
.sheet .head .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--c)}
.sheet .head .tm{font-family:var(--mono);font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--soft)}
.confirm{background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px}
.check{border-color:var(--pc,var(--muted))}
.check.on{background:var(--pc,var(--study));border-color:var(--pc,var(--study))}
.prio{display:flex;gap:6px}
.prio button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 4px;font-size:13px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}
.prio button i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.prio button[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--card))}
.cal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav button{background:none;border:0;font-size:22px;padding:4px 12px;color:var(--ink)}
.calnav b{font-size:17px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calgrid .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cell{border:1px solid transparent;background:var(--bg);border-radius:10px;min-height:64px;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:center}
.cell .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.cell.out{opacity:.4}
.cell.today .n{color:var(--accent)}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--ink);color:var(--bg)}
.cell.sel.today .n{color:var(--bg)}
.cell .b{height:4px;border-radius:2px;background:var(--pc)}
.cell .b.dn{opacity:.3}
.cell .more{font-size:10px;font-weight:700;color:var(--muted);line-height:1}
.cell.sel .more{color:var(--bg)}
.plegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px;justify-content:center}
.plegend span{display:flex;align-items:center;gap:6px}
.plegend i{width:14px;height:4px;border-radius:2px;background:var(--pc)}
.restbar{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.restbar .rb-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gym);opacity:.35;transition:width .5s linear}
.restbar .rb-t{position:relative;flex:1;font-weight:700;font-variant-numeric:tabular-nums}
.restbar button{position:relative;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;border:0;border-radius:10px;padding:7px 10px;font-weight:650;font-size:14px}
body.resting{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.wprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.wprog i{display:block;height:100%;background:var(--gym)}
.excard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.excard.exdone{border-color:var(--study)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:750;font-size:17px}
.chip.ok{background:var(--study);color:#fff}
.sug{font-weight:600;color:var(--ink)}.sug.up{color:var(--gym)}
.sets{display:flex;flex-direction:column;gap:6px}
.sethead,.setrow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--muted);font-weight:650}
.setrow input{text-align:center;font-variant-numeric:tabular-nums;padding:9px 6px}
.setrow .sn{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.setrow.sdone input{background:color-mix(in srgb,var(--study) 12%,var(--card));border-color:transparent}
.sok{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:800;color:var(--muted)}
.sok.on{background:var(--study);border-color:var(--study);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}.hist li span:last-child{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.chart{margin:0}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .cg{stroke:var(--line);stroke-width:1}.chart .ct{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .cl{fill:none;stroke:var(--gym);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cp{fill:var(--gym);stroke:var(--card);stroke-width:2}.chart .chit{fill:transparent;cursor:pointer}
.chart figcaption{margin-top:4px}

.ltiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ltile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 14px;min-height:190px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.ltile:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.lt-head{display:flex;align-items:center;gap:8px;min-width:0}
.lt-dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.lt-dot.big{width:40px;height:40px;font-size:18px}
.lt-title{font-weight:750;font-size:15px;color:color-mix(in srgb,var(--c) 70%,var(--ink));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.lt-items li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.3}
.lt-items li span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lt-check{flex:none;width:18px;height:18px;margin-top:1px;border-radius:5px;border:2px solid var(--c);background:none;padding:0}
.lt-more{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:auto}
.lt-empty{flex:1;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;font-weight:300;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink)}
.empty{padding:18px 14px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
@media (max-width:400px){.ev{grid-template-columns:76px 4px 1fr auto;gap:10px;padding:11px 12px}.ev .t{font-size:11.5px}}
</style>

<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>

<script>
"use strict";
/* ================== ТИПЫ ================== */
const TYPES={
  uni:["Вуз","--uni"],road:["Дорога","--road"],gym:["Зал","--gym"],pool:["Бассейн","--pool"],
  food:["Еда","--food"],study:["Учёба","--study"],rest:["Отдых","--rest"],chores:["Дела","--chores"],
  drive:["Вождение","--drive"],sleep:["Сон","--sleep"],other:["Другое","--other"]
};
const DN=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DFULL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const KEY="moya-nedelya-v1";

/* ================== ДАННЫЕ ==================
   В коде нет личных данных: расписание, планы и задачи
   загружаются из файла копии и хранятся только на устройстве. */
const uid=()=>Math.random().toString(36).slice(2,10);
const emptyWeek=()=>Array.from({length:7},()=>[]);
function makeDefault(){
  return{v:2,weeks:{odd:emptyWeek(),even:emptyWeek()},dated:{},workouts:[],bodyweight:[],lists:[],listItems:[],plans:{},tasks:[],deletedTasks:{},settings:{invert:false},schedAt:0};
}
function isEmptySchedule(){return !DB.weeks.odd.some(d=>d.length)&&!DB.weeks.even.some(d=>d.length)}
let DB;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.weeks){DB=normalize(d);return}}}catch(e){}
  DB=makeDefault();
}
function normalize(d){
  const b=makeDefault();
  d.weeks=d.weeks||b.weeks;d.plans=d.plans||{};d.tasks=d.tasks||[];d.deletedTasks=d.deletedTasks||{};
  d.settings=d.settings||b.settings;d.dated=d.dated||{};d.workouts=d.workouts||[];d.bodyweight=d.bodyweight||[];d.lists=d.lists||[];d.listItems=d.listItems||[];d.schedAt=d.schedAt||0;
  d.tasks.forEach(t=>{if(!t.updated)t.updated=t.doneAt||t.created||0});
  return d;
}
function saveSched(){DB.schedAt=Date.now();save()}
function delItems(coll,ids){const now=Date.now();ids.forEach(id=>{DB.deletedTasks[id]=now});DB[coll]=DB[coll].filter(t=>!ids.includes(t.id))}
function delTasks(ids){const now=Date.now();ids.forEach(id=>{DB.deletedTasks[id]=now});DB.tasks=DB.tasks.filter(t=>!ids.includes(t.id))}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("Не удалось сохранить")}}
function save(){saveLocal();scheduleSync()}
load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================== ВРЕМЯ ================== */
const toMin=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
const pad=n=>String(n).padStart(2,"0");
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekOf(d){
  const base=new Date(2026,7,31); // пн 31.08.2026 — первая (нечётная) неделя
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const wi=Math.floor(Math.round((day-base)/864e5)/7);
  let odd=((wi%2)+2)%2===0;
  if(DB.settings.invert)odd=!odd;
  return odd?"odd":"even";
}
const todayIdx=()=>(new Date().getDay()+6)%7;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function md(src){
  const lines=String(src||"").split("\n");let out="",list=null;
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const l of lines){
    let m;
    if(/^#\s+/.test(l)){close();out+=`<h3>${inline(l.replace(/^#+\s+/,""))}</h3>`}
    else if((m=l.match(/^\s*[-•]\s+(.*)/))){if(list!=="ul"){close();out+="<ul>";list="ul"}out+=`<li>${inline(m[1])}</li>`}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();out+="<ol>";list="ol"}out+=`<li>${inline(m[1])}</li>`}
    else if(!l.trim()){close()}
    else{close();out+=`<p>${inline(l)}</p>`}
  }
  close();return out;
}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function sorted(day){return[...day].sort((a,b)=>{const k=x=>x.t==="sleep"&&toMin(x.s)>=18*60?toMin(x.s):toMin(x.s);return k(a)-k(b)})}
function detailsOf(e){if(e.ref&&DB.plans[e.ref])return DB.plans[e.ref].body;return e.details||""}
function hasDetails(e){return !!((e.ref&&DB.plans[e.ref])||(e.details&&e.details.trim()))}

function taskRow(t){
  const today=isoDate(new Date());
  const late=t.due&&!t.done&&t.due<today;
  return `<li class="task ${t.done?"done":""}" style="--pc:var(--p${t.pr||2})">
    <button class="check ${t.done?"on":""}" data-tog="${t.id}" aria-label="${t.done?"Вернуть":"Выполнено"}"></button>
    <button class="txt" data-edittask="${t.id}"><div>${esc(t.text)}</div>${t.due?`<div class="due ${late?"late":""}">${fmtDate(t.due)}${late?" · просрочено":""}</div>`:""}</button>
    <button class="x" data-deltask="${t.id}" aria-label="Удалить">×</button></li>`;
}
function fmtDate(iso){
  const [y,m,d]=iso.split("-").map(Number);const dt=new Date(y,m-1,d);
  const today=new Date();const tm=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const diff=Math.round((dt-tm)/864e5);
  if(diff===0)return"Сегодня";if(diff===1)return"Завтра";if(diff===-1)return"Вчера";
  return dt.toLocaleDateString("ru-RU",{day:"numeric",month:"short",weekday:"short"});
}
function bindTaskRows(root){
  root.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const t=DB.tasks.find(x=>x.id===b.dataset.tog);t.done=!t.done;t.doneAt=t.done?Date.now():null;t.updated=Date.now();save();render()});
  root.querySelectorAll("[data-deltask]").forEach(b=>b.onclick=()=>{delTasks([b.dataset.deltask]);save();render();toast("Задача удалена")});
  root.querySelectorAll("[data-edittask]").forEach(b=>b.onclick=()=>openTaskEditor(b.dataset.edittask));
}

/* ---------- календарь: день = шаблон недели или отдельно изменённый день ---------- */
const MON_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MON_NOM=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const parseISO=iso=>{const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return isoDate(d)};
const wdOf=iso=>(parseISO(iso).getDay()+6)%7;
function dayInfo(iso){
  const w=weekOf(parseISO(iso)),d=wdOf(iso);
  if(DB.dated[iso])return{list:DB.dated[iso],own:true,w,d};
  return{list:DB.weeks[w][d],own:false,w,d};
}
const KEYT=["uni","gym","pool","drive"];

function renderSched(){

function svSwitch(){return `<div class="row" role="group" aria-label="Режим"><button class="pill" id="sv-cal" aria-pressed="${UI.sv==="cal"}">Календарь</button><button class="pill" id="sv-tpl" aria-pressed="${UI.sv==="tpl"}">Шаблон</button></div>`}
function bindSv(){$("#sv-cal").onclick=()=>{UI.sv="cal";render()};$("#sv-tpl").onclick=()=>{UI.sv="tpl";render()}}

function evListHTML(list,isToday){
  const nm=new Date().getHours()*60+new Date().getMinutes();

  return `<ol class="list" id="evlist">${day.length?day.map(e=>{
    let cur=false;if(isToday&&e.t!=="sleep"){const s=toMin(e.s),en=toMin(e.e);cur=nm>=s&&nm<(en>s?en:1440)}
    const big=KEYT.includes(e.t);
    return `<li><button class="ev ${big?"big":""} ${cur?"cur":""}" data-ev="${e.id}" style="--c:var(${(TYPES[e.t]||TYPES.other)[1]})">
      <span class="t">${e.s}–${e.e}</span><span class="bar"></span>
      <span><span class="what">${esc(e.title)}</span>${cur?'<span class="nowtag">СЕЙЧАС</span>':""}${e.note?`<span class="note" style="display:block">${esc(e.note)}</span>`:""}</span>
      <span class="chev">${hasDetails(e)?"›":""}</span></button></li>`}).join(""):`<li class="empty">В этот день пока пусто</li>`}</ol>`;
}
function legendHTML(){return `<div class="legend">${Object.entries(TYPES).filter(([k])=>k!=="other").map(([k,[n,v]])=>`<span style="--c:var(${v})"><i></i>${n}</span>`).join("")}</div>`}

    ${info.own?`<div class="row small"><span class="chip">Изменённый день</span><button class="link" id="reset-day">вернуть обычное расписание</button></div>`:""}

  const rd=$("#reset-day");if(rd)rd.onclick=()=>{
    rd.parentElement.innerHTML=`<div class="confirm" style="width:100%"><div>Убрать изменения этого дня и показать обычное расписание по шаблону?</div><div class="grid2"><button class="btn" id="c-no">Отмена</button><button class="btn danger" id="c-yes">Вернуть</button></div></div>`;
    $("#c-no").onclick=render;$("#c-yes").onclick=()=>{delete DB.dated[sel];saveSched();render();toast("День вернулся к шаблону")};
  };
  $("#add-ev").onclick=()=>openEventEditor(null,{kind:"date",iso:sel});
  $("#app").querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>openEvent(b.dataset.ev,{kind:"date",iso:sel}));
  bindTaskRows($("#app"));

function openMonthPicker(iso){
  let cur=parseISO(iso);cur=new Date(cur.getFullYear(),cur.getMonth(),1);
  const today=isoDate(new Date());
  const draw=()=>{
    const y=cur.getFullYear(),m=cur.getMonth();
    const off=(cur.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells=Math.ceil((off+last)/7)*7;
    let g=DN.map(d=>`<div class="wd">${d}</div>`).join("");
    for(let i=0;i<cells;i++){
      const d=new Date(y,m,1-off+i),di=isoDate(d),inf=dayInfo(di);
      const bars=sorted(inf.list).filter(e=>KEYT.includes(e.t)).slice(0,4);
      g+=`<button class="cell ${d.getMonth()!==m?"out":""} ${di===today?"today":""} ${di===UI.date?"sel":""}" data-pick="${di}">
        <span class="n">${d.getDate()}</span>${bars.map(e=>`<span class="b" style="--pc:var(${TYPES[e.t][1]})"></span>`).join("")}</button>`;
    }
    sheet(`<div class="calnav"><button id="mp-prev" aria-label="Предыдущий месяц">‹</button><b>${MON_NOM[m]} ${y}</b><button id="mp-next" aria-label="Следующий месяц">›</button></div>
      <div class="calgrid">${g}</div>
      <div class="plegend">${KEYT.map(k=>`<span style="--pc:var(${TYPES[k][1]})"><i></i>${TYPES[k][0]}</span>`).join("")}</div>`,()=>{
      $("#mp-prev").onclick=()=>{cur=new Date(y,m-1,1);draw()};
      $("#mp-next").onclick=()=>{cur=new Date(y,m+1,1);draw()};
      document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{UI.date=b.dataset.pick;closeSheet();render()});
    });
  };
  draw();
}

/* ---------- лист (bottom sheet) ---------- */
function sheet(html,onMount){
  const L=$("#layer");
  L.innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="inner"><div class="grab"></div>${html}</div></div>`;
  $("#scrim").onclick=closeSheet;
  document.body.style.overflow="hidden";
  onMount&&onMount(L.querySelector(".sheet"));
}
function closeSheet(){$("#layer").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

function locList(loc){return loc.kind==="tpl"?DB.weeks[loc.w][loc.d]:dayInfo(loc.iso).list}
function locLabel(loc){
  if(loc.kind==="tpl")return `Шаблон: ${DFULL[loc.d].toLowerCase()}, ${loc.w==="odd"?"нечётная":"чётная"} неделя`;
  const d=parseISO(loc.iso);return `${DFULL[wdOf(loc.iso)]}, ${d.getDate()} ${MON_GEN[d.getMonth()]}`;
}
// превратить день в «изменённый»: копия шаблона с новыми id; возвращает карту старый id → новый
function materialize(iso){
  if(DB.dated[iso])return null;
  const inf=dayInfo(iso),map={};
  DB.dated[iso]=inf.list.map(e=>{const n={...e,id:uid()};map[e.id]=n.id;return n});
  return map;
}

function openEvent(id,loc){
  const e=locList(loc).find(x=>x.id===id);if(!e)return;
  const plan=e.ref&&DB.plans[e.ref];
  sheet(`
    <div class="head" style="--c:var(${(TYPES[e.t]||TYPES.other)[1]})"><div class="sw"></div>
      <div style="flex:1"><div class="tm">${e.s}–${e.e} · ${locLabel(loc)}</div>
      <h2 style="margin-top:2px">${esc(e.title)}</h2>${e.note?`<div class="muted small" style="margin-top:4px">${esc(e.note)}</div>`:""}</div></div>
    ${plan?`<div class="chips"><span class="chip">План: ${esc(plan.title)}</span></div>`:""}
    ${hasDetails(e)?`<div class="md">${md(detailsOf(e))}</div>`:`<p class="muted">Подробностей пока нет. Нажми «Изменить», чтобы добавить свой текст или привязать план.</p>`}
    <div class="grid2">
      <button class="btn primary" id="ev-edit">Изменить</button>
      ${plan?`<button class="btn" id="ev-plan">Изменить план</button>`:`<button class="btn" id="ev-close">Закрыть</button>`}
    </div>
    ${plan&&plan.type==="gym"&&parsePlan(e.ref).length?`<button class="btn block" id="ev-start" style="background:var(--gym);color:#fff">${ACTIVE?"Открыть идущую тренировку":"Начать тренировку"}</button>`:""}`,()=>{
      const st=$("#ev-start");if(st)st.onclick=()=>{if(ACTIVE){closeSheet();UI.tab="gym";render()}else startWorkout(e.ref)};
      $("#ev-edit").onclick=()=>openEventEditor(id,loc);
      const p=$("#ev-plan");if(p)p.onclick=()=>openPlanEditor(e.ref);
      const c=$("#ev-close");if(c)c.onclick=closeSheet;
    });
}

function openEventEditor(id,loc){
  const list=locList(loc);
  const e0=id?list.find(x=>x.id===id):null;
  const e=e0||{s:"12:00",e:"13:00",t:"other",title:"",note:"",details:""};
  const mode=e.ref?"plan:"+e.ref:(e.details?"own":"none");
  const planOpts=Object.entries(DB.plans).map(([k,p])=>`<option value="plan:${k}" ${mode==="plan:"+k?"selected":""}>План: ${esc(p.title)}</option>`).join("");
  // где сохранять: для даты — «только этот день» или «в шаблон»
  let scopeHTML="";
  if(loc.kind==="date"){
    const inf=dayInfo(loc.iso);
    const tplName=`Все ${["понедельники","вторники","среды","четверги","пятницы","субботы","воскресенья"][inf.d]} (${inf.w==="odd"?"нечётн.":"чётн."})`;
    const canTpl=!e0||!inf.own;
    scopeHTML=canTpl?`<div class="field"><label>Где изменить</label><div class="prio" id="f-scope">
        <button type="button" data-sc="day" aria-pressed="true" style="--pc:var(--accent)">Только этот день</button>
        <button type="button" data-sc="tpl" aria-pressed="false" style="--pc:var(--accent)">${tplName}</button></div></div>`
      :`<div class="small muted">Этот день изменён отдельно, правка коснётся только его.</div>`;
  }else{
    scopeHTML=e0?"":`<label class="row small"><input type="checkbox" id="f-both"> Добавить и в ${loc.w==="odd"?"чётную":"нечётную"} неделю, в тот же день</label>`;
  }
  sheet(`
    <h2>${e0?"Изменить событие":"Новое событие"}</h2>
    <div class="muted small">${locLabel(loc)}</div>
    <div class="field"><label for="f-title">Название</label><input type="text" id="f-title" value="${esc(e.title)}" placeholder="Например, Урок вождения"></div>
    <div class="grid2">
      <div class="field"><label for="f-s">Начало</label><input type="time" id="f-s" value="${e.s}"></div>
      <div class="field"><label for="f-e">Конец</label><input type="time" id="f-e" value="${e.e}"></div>
    </div>
    <div class="field"><label for="f-t">Тип</label><select id="f-t">${Object.entries(TYPES).map(([k,[n]])=>`<option value="${k}" ${e.t===k?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="field"><label for="f-note">Короткая заметка</label><input type="text" id="f-note" value="${esc(e.note)}" placeholder="Видна прямо в расписании"></div>

const byPr=(a,b)=>(a.done-b.done)||((a.pr||2)-(b.pr||2))||a.created-b.created;
function listHTML(today){
  const open=DB.tasks.filter(t=>!t.done);
  const byDue=(a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||((a.pr||2)-(b.pr||2))||a.created-b.created;
  const groups=[
    ["Просрочено",open.filter(t=>t.due&&t.due<today)],
    ["Сегодня",open.filter(t=>t.due===today)],
    ["Позже",open.filter(t=>t.due&&t.due>today)],

  ].filter(g=>g[1].length);

  return `${groups.length?groups.map(([n,list])=>`<div class="group-title">${n}</div><ul class="list">${list.sort(byDue).map(taskRow).join("")}</ul>`).join(""):`<div class="card empty">Задач нет. Добавь первую сверху.</div>`}

function monthHTML(today){
  const y=UI.mY,m=UI.mM;
  const first=new Date(y,m,1);const start=new Date(y,m,1-((first.getDay()+6)%7));
  const last=new Date(y,m+1,0);const cells=Math.ceil((((first.getDay()+6)%7)+last.getDate())/7)*7;
  const byDay={};DB.tasks.forEach(t=>{if(t.due)(byDay[t.due]=byDay[t.due]||[]).push(t)});
  let grid=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>`<div class="wd">${d}</div>`).join("");
  for(let i=0;i<cells;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const iso=isoDate(d);
    const list=(byDay[iso]||[]).sort(byPr);const show=list.slice(0,4);

  }
  const sel=(byDay[UI.selDay]||[]).sort(byPr);
  const isCur=(()=>{const d=new Date();return d.getFullYear()===y&&d.getMonth()===m&&UI.selDay===today})();
  return `<div class="cal">
      <div class="calnav"><button id="m-prev" aria-label="Предыдущий месяц">‹</button><b>${MONTHS[m]} ${y}</b><button id="m-next" aria-label="Следующий месяц">›</button></div>

async function exportData(){
  const json=JSON.stringify(DB,null,1);
  const name=`nedelya-${isoDate(new Date())}.json`;
  try{
    const file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Моя неделя — копия"});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    toast("Файл сохранён");
  }catch(e){toast("Не получилось сохранить")}
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;ev.target.value="";
  const r=new FileReader();
  r.onload=()=>{
    let inc;try{inc=normalize(JSON.parse(r.result));if(!inc.weeks.odd||!inc.weeks.even)throw 0}catch(e){toast("Это не файл копии");return}
    const msg=mergeIn(inc);save();UI.w=weekOf(new Date());render();showImportResult(msg);
  };
  r.readAsText(f);
}
function mergeIn(inc){
  const res=[];
  // 1. Расписание и планы: берём то, что меняли позже
  const localEmpty=isEmptySchedule()&&!Object.keys(DB.plans).length;
  if(localEmpty||inc.schedAt>DB.schedAt){DB.weeks=inc.weeks;DB.plans=inc.plans;DB.dated=inc.dated||{};DB.schedAt=inc.schedAt;res.push("Расписание и планы обновлены из файла")}
  else if(inc.schedAt<DB.schedAt)res.push("Расписание здесь новее, чем в файле, — оставлено как есть");
  else res.push("Расписание не менялось");
  // 2. Настройки
  if((inc.settings.at||0)>(DB.settings.at||0))DB.settings=inc.settings;
  // 3. Задачи, тренировки, вес тела: объединяем по id, учитывая удаления
  const tomb={...DB.deletedTasks};
  for(const[id,ts] of Object.entries(inc.deletedTasks||{}))tomb[id]=Math.max(tomb[id]||0,ts);
  const stat={};
  for(const coll of ["tasks","workouts","bodyweight","lists","listItems"]){
    const map=new Map();let added=0,updated=0,removed=0;
    (DB[coll]||[]).forEach(t=>map.set(t.id,t));
    (inc[coll]||[]).forEach(t=>{const cur=map.get(t.id);
      if(!cur){map.set(t.id,t);added++}
      else if((t.updated||0)>(cur.updated||0)){map.set(t.id,t);updated++}});
    DB[coll]=[...map.values()].filter(t=>{const d=tomb[t.id];if(d&&d>=(t.updated||0)){removed++;return false}return true});
    stat[coll]={added,updated,removed};
  }
  // старые метки удалений держим 90 дней
  const cutoff=Date.now()-90*864e5;for(const id in tomb)if(tomb[id]<cutoff)delete tomb[id];
  DB.deletedTasks=tomb;
  res.push(`Задачи: новых ${stat.tasks.added}, обновлено ${stat.tasks.updated}, удалено ${stat.tasks.removed}`);
  if(stat.workouts.added||stat.workouts.removed)res.push(`Тренировки: новых ${stat.workouts.added}, удалено ${stat.workouts.removed}`);
  return res;
}

  sheet(`<h2>Копия загружена</h2><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <button class="btn primary block" id="ir-ok">Готово</button>`,()=>{$("#ir-ok").onclick=closeSheet});
}

/* ================== ЗАЛ: ДНЕВНИК ТРЕНИРОВОК ==================
   Упражнения берутся из текста планов типа «Зал» (строки вида
   «1. **Присед со штангой** — 4×5–8»). Идущая тренировка хранится только
   на этом устройстве; законченная попадает в DB.workouts и синхронизируется. */
const ACTIVE_KEY=KEY+"-active";
let ACTIVE=null;
try{ACTIVE=JSON.parse(localStorage.getItem(ACTIVE_KEY)||"null")}catch(e){}
function saveActive(){try{ACTIVE?localStorage.setItem(ACTIVE_KEY,JSON.stringify(ACTIVE)):localStorage.removeItem(ACTIVE_KEY)}catch(e){}}

const BW_RE=/подтяг|брусья|гиперэкст|подъём ног|подъемы ног|подъёмы ног|отжим|скручив|планк/i;
const nkey=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
function parsePlan(pid){
  const p=DB.plans[pid];if(!p)return[];
  const out=[];
  for(const line of String(p.body||"").split("\n")){
    const m=line.match(/^\s*\d+[.)]\s+\*\*(.+?)\*\*(.*)$/);if(!m)continue;
    const sr=m[2].match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*[×xх]\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
    if(!sr)continue;
    const name=m[1].trim(),sets=+(sr[2]||sr[1]),rmin=+sr[3],rmax=+(sr[4]||sr[3]);
    const bw=BW_RE.test(name);
    out.push({name,sets,rmin,rmax,bw,step:bw?0:(/гантел|молот|махи|развед/i.test(name)?2:2.5),rest:out.length===0?180:90});
  }
  return out;
}
const gymPlans=()=>Object.entries(DB.plans).filter(([k,p])=>p.type==="gym"&&parsePlan(k).length);

const e1rm=(w,r)=>w>0&&r>0?(r===1?w:w*(1+r/30)):0;
const fmtKg=n=>(Math.round(n*10)/10).toString().replace(".",",");
const parseNum=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};

function lastFor(name,exceptId){
  const k=nkey(name);
  const ws=[...DB.workouts].filter(w=>w.id!==exceptId).sort((a,b)=>b.startedAt-a.startedAt);
  for(const w of ws){const ex=w.exercises.find(x=>nkey(x.name)===k);if(ex&&ex.sets.length)return{date:w.date,sets:ex.sets}}
  return null;
}
function suggest(ex){
  const last=lastFor(ex.name,ACTIVE&&ACTIVE.id);
  if(!last)return{w:"",text:ex.bw?"Первый раз: запиши повторы":"Первый раз: подбери рабочий вес"};
  const top=Math.max(...last.sets.map(s=>s.w||0));
  const topSets=last.sets.filter(s=>(s.w||0)===top);
  const allMax=last.sets.length>=(ex.target??ex.sets)&&last.sets.every(s=>s.r>=ex.rmax);
  if(ex.bw){
    return allMax?{w:top||"",text:top?`Все подходы по ${ex.rmax}: добавь вес или повторы`:`Все подходы по ${ex.rmax}: можно с доп. весом`}:{w:top||"",text:"Добери повторы до "+ex.rmax};
  }
  if(allMax&&ex.step)return{w:top+ex.step,text:`Прибавь: ${fmtKg(top+ex.step)} кг (+${fmtKg(ex.step)})`,up:true};
  const minR=Math.min(...topSets.map(s=>s.r));
  return{w:top,text:minR<ex.rmin?`Тот же вес ${fmtKg(top)} кг, повторов было мало`:`Тот же вес ${fmtKg(top)} кг, добери до ${ex.rmax}`};
}

function startWorkout(pid){
  const p=DB.plans[pid];if(!p)return;
  if(ACTIVE){toast("Сначала заверши текущую тренировку");UI.tab="gym";render();return}
  const exs=parsePlan(pid).map(e=>{const s=suggest(e);return{...e,target:e.sets,sets:Array.from({length:e.sets},()=>({w:s.w===""?"":String(s.w),r:"",done:false}))}});
  ACTIVE={id:uid(),planId:pid,title:p.title,date:isoDate(new Date()),startedAt:Date.now(),exercises:exs,rest:null};
  saveActive();closeSheet();UI.tab="gym";render();window.scrollTo(0,0);
}

/* ---------- таймер отдыха ---------- */
let restTick=null,audioCtx=null;
function beep(){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+0.15)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function startRest(sec){
  if(!ACTIVE)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
  ACTIVE.rest={until:Date.now()+sec*1000,total:sec};saveActive();drawRest();
}
function drawRest(){
  let bar=$("#restbar");
  document.body.classList.toggle("resting",!!(ACTIVE&&ACTIVE.rest));
  if(!ACTIVE||!ACTIVE.rest){if(bar)bar.remove();clearInterval(restTick);restTick=null;return}
  if(!bar){bar=document.createElement("div");bar.id="restbar";bar.className="restbar";document.body.appendChild(bar)}
  const left=Math.max(0,Math.round((ACTIVE.rest.until-Date.now())/1000));
  const pct=ACTIVE.rest.total?100-left/ACTIVE.rest.total*100:100;
  bar.innerHTML=`<div class="rb-fill" style="width:${pct}%"></div><span class="rb-t">${left?"Отдых "+Math.floor(left/60)+":"+pad(left%60):"Можно работать"}</span>
    <button id="rb-plus">+30 с</button><button id="rb-skip">${left?"Пропустить":"Закрыть"}</button>`;
  $("#rb-plus").onclick=()=>{ACTIVE.rest.until=Math.max(ACTIVE.rest.until,Date.now())+30000;ACTIVE.rest.total+=30;ACTIVE.rest.beeped=false;saveActive();drawRest()};
  $("#rb-skip").onclick=()=>{ACTIVE.rest=null;saveActive();drawRest()};
  if(!left&&!ACTIVE.rest.beeped){ACTIVE.rest.beeped=true;saveActive();beep();toast("Отдых закончился")}
  if(!restTick)restTick=setInterval(drawRest,500);
}

/* ---------- экран «Зал» ---------- */
function renderGym(){ACTIVE?renderActive():renderGymHome()}

function renderActive(){
  const a=ACTIVE;
  const mins=Math.floor((Date.now()-a.startedAt)/60000);
  const doneSets=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const allSets=a.exercises.reduce((n,e)=>n+e.sets.length,0);
  $("#app").innerHTML=`
    <div class="row between"><h1 style="font-size:24px">${esc(a.title)}</h1><span class="small muted" id="w-elapsed">${mins} мин</span></div>
    <div class="wprog"><i style="width:${allSets?doneSets/allSets*100:0}%"></i></div>
    <div class="small muted" style="margin-top:-6px">Подходов: ${doneSets} из ${allSets}</div>
    ${a.exercises.map((ex,i)=>{
      const last=lastFor(ex.name,a.id),sg=suggest(ex);
      const done=ex.sets.length&&ex.sets.every(s=>s.done);
      return `<section class="excard ${done?"exdone":""}">
        <div class="exhead"><div><div class="exname">${esc(ex.name)}</div>
          <div class="small muted">${ex.target} × ${ex.rmin}${ex.rmax!==ex.rmin?"–"+ex.rmax:""}${ex.bw?" · свой вес":""} · отдых ${ex.rest>=120?Math.round(ex.rest/60)+" мин":ex.rest+" с"}</div></div>
          ${done?'<span class="chip ok">готово</span>':""}</div>
        ${last?`<div class="small muted">Прошлый раз: ${last.sets.map(s=>(ex.bw&&!s.w?"":fmtKg(s.w)+"×")+s.r).join(" · ")}</div>`:""}
        <div class="small sug ${sg.up?"up":""}">${esc(sg.text)}</div>
        <div class="sets">
          <div class="sethead"><span>№</span><span>${ex.bw?"доп. кг":"кг"}</span><span>повт.</span><span></span></div>
          ${ex.sets.map((s,j)=>`<div class="setrow ${s.done?"sdone":""}">
            <span class="sn">${j+1}</span>
            <input id="w-${i}-${j}" data-ex="${i}" data-set="${j}" data-f="w" inputmode="decimal" value="${esc(s.w)}" placeholder="${ex.bw?"0":"вес"}" aria-label="Вес, подход ${j+1}">
            <input id="r-${i}-${j}" data-ex="${i}" data-set="${j}" data-f="r" inputmode="numeric" value="${esc(s.r)}" placeholder="${ex.rmin}${ex.rmax!==ex.rmin?"–"+ex.rmax:""}" aria-label="Повторы, подход ${j+1}">
            <button class="sok ${s.done?"on":""}" data-ok="${i}-${j}" aria-label="${s.done?"Отменить подход":"Подход сделан"}">✓</button></div>`).join("")}
        </div>
        <div class="row between"><button class="link" data-addset="${i}">+ подход</button>${ex.sets.length>1?`<button class="link" data-delset="${i}" style="color:var(--muted)">− подход</button>`:""}</div>
      </section>`}).join("")}
    <div class="card" style="display:flex;gap:8px"><input type="text" id="w-newex" placeholder="Добавить упражнение" style="flex:1"><button class="btn" id="w-addex">+</button></div>
    <div id="w-end" class="grid2"><button class="btn danger" id="w-cancel">Отменить</button><button class="btn primary" id="w-finish">Завершить</button></div>`;
  const app=$("#app");
  app.querySelectorAll("input[data-ex]").forEach(inp=>inp.oninput=()=>{a.exercises[+inp.dataset.ex].sets[+inp.dataset.set][inp.dataset.f]=inp.value;saveActive()});
  app.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{
    const[i,j]=b.dataset.ok.split("-").map(Number);const ex=a.exercises[i],s=ex.sets[j];
    if(!s.done&&!s.r){const rr=$(`#r-${i}-${j}`);rr&&rr.focus();toast("Впиши повторы");return}
    s.done=!s.done;
    if(s.done){
      // подставить вес в следующий пустой подход
      const nx=ex.sets[j+1];if(nx&&!nx.done&&!nx.w)nx.w=s.w;
      startRest(ex.rest);
    }
    saveActive();renderActive();
  });
  app.querySelectorAll("[data-addset]").forEach(b=>b.onclick=()=>{const ex=a.exercises[+b.dataset.addset];const l=ex.sets[ex.sets.length-1];ex.sets.push({w:l?l.w:"",r:"",done:false});saveActive();renderActive()});
  app.querySelectorAll("[data-delset]").forEach(b=>b.onclick=()=>{const ex=a.exercises[+b.dataset.delset];ex.sets.pop();saveActive();renderActive()});
  $("#w-addex").onclick=()=>{const n=$("#w-newex").value.trim();if(!n)return;a.exercises.push({name:n,target:1,rmin:8,rmax:12,bw:BW_RE.test(n),step:2.5,rest:90,sets:[{w:"",r:"",done:false}]});saveActive();renderActive()};
  $("#w-cancel").onclick=()=>{
    $("#w-end").outerHTML=`<div class="confirm"><div>Отменить тренировку? Записанные подходы не сохранятся.</div><div class="grid2"><button class="btn" id="c-no">Назад</button><button class="btn danger" id="c-yes">Отменить</button></div></div>`;
    $("#c-no").onclick=renderActive;$("#c-yes").onclick=()=>{ACTIVE=null;saveActive();drawRest();render();toast("Тренировка отменена")};
  };
  $("#w-finish").onclick=finishWorkout;
  drawRest();
}

function finishWorkout(){
  const a=ACTIVE;
  const exercises=a.exercises.map(ex=>({name:ex.name,sets:ex.sets.filter(s=>s.done).map(s=>({w:parseNum(s.w),r:Math.round(parseNum(s.r))}))})).filter(e=>e.sets.length);
  if(!exercises.length){toast("Нет ни одного сделанного подхода");return}
  // рекорды: лучший расчётный максимум против всей прошлой истории
  const records=[];
  for(const ex of exercises){
    const best=Math.max(...ex.sets.map(s=>e1rm(s.w,s.r)));if(!best)continue;
    const k=nkey(ex.name);let prev=0;
    DB.workouts.forEach(w=>w.exercises.forEach(x=>{if(nkey(x.name)===k)x.sets.forEach(s=>prev=Math.max(prev,e1rm(s.w,s.r)))}));
    if(prev&&best>prev+0.01)records.push(`${ex.name}: ≈${fmtKg(best)} кг (было ${fmtKg(prev)})`);
  }
  const w={id:a.id,planId:a.planId,title:a.title,date:a.date,startedAt:a.startedAt,finishedAt:Date.now(),exercises,updated:Date.now()};
  DB.workouts.push(w);ACTIVE=null;saveActive();save();drawRest();render();
  const sets=exercises.reduce((n,e)=>n+e.sets.length,0),vol=exercises.reduce((n,e)=>n+e.sets.reduce((m,s)=>m+s.w*s.r,0),0);
  sheet(`<h2>Тренировка записана</h2>
    <div class="stats"><div><b>${Math.round((w.finishedAt-w.startedAt)/60000)}</b><span>минут</span></div><div><b>${sets}</b><span>подходов</span></div><div><b>${Math.round(vol).toLocaleString("ru-RU")}</b><span>кг объём</span></div></div>
    ${records.length?`<div class="card" style="background:var(--soft);border:0"><h3>Новые рекорды</h3><ul style="margin:0;padding-left:20px">${records.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}
    <button class="btn primary block" id="fw-ok">Готово</button>`,()=>{$("#fw-ok").onclick=closeSheet});
}

function allExerciseNames(){
  const m=new Map();
  [...DB.workouts].sort((a,b)=>b.startedAt-a.startedAt).forEach(w=>w.exercises.forEach(x=>{const k=nkey(x.name);if(!m.has(k))m.set(k,x.name)}));
  return[...m.values()];
}
function exerciseHistory(name){
  const k=nkey(name);
  return[...DB.workouts].sort((a,b)=>a.startedAt-b.startedAt).map(w=>{
    const ex=w.exercises.find(x=>nkey(x.name)===k);if(!ex||!ex.sets.length)return null;
    const best=ex.sets.reduce((b,s)=>e1rm(s.w,s.r)>e1rm(b.w,b.r)?s:b,ex.sets[0]);
    return{date:w.date,t:w.startedAt,best,e:e1rm(best.w,best.r),maxR:Math.max(...ex.sets.map(s=>s.r)),sets:ex.sets};
  }).filter(Boolean);
}
const shortDate=iso=>{const d=parseISO(iso);return `${d.getDate()} ${MON_GEN[d.getMonth()].slice(0,3)}`};

/* Линейный график одного ряда. points: [{x:ms, y, label}] */
function lineChart(id,points,unit){
  if(points.length<2)return `<p class="small muted" style="margin:0">Для графика нужно хотя бы две записи.</p>`;
  const W=320,H=150,L=38,R=12,T=12,B=24;
  const xs=points.map(p=>p.x),ys=points.map(p=>p.y);
  let y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<1){y0-=1;y1+=1}
  const padY=(y1-y0)*0.15;y0=Math.max(0,y0-padY);y1+=padY;
  const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  const X=x=>L+(x1===x0?0.5:(x-x0)/(x1-x0))*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const ticks=[y0,(y0+y1)/2,y1];
  const d=points.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const last=points[points.length-1];
  return `<figure class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График: ${esc(points.map(p=>p.label).join("; "))}">
      ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" class="cg"/><text x="${L-6}" y="${Y(t)+4}" class="ct" text-anchor="end">${Math.round(t)}</text>`).join("")}
      <text x="${L}" y="${H-6}" class="ct">${esc(shortDate(isoDate(new Date(x0))))}</text>
      <text x="${W-R}" y="${H-6}" class="ct" text-anchor="end">${esc(shortDate(isoDate(new Date(x1))))}</text>
      <path d="${d}" class="cl"/>
      ${points.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===points.length-1?5:4}" class="cp ${i===points.length-1?"cpl":""}"/>`).join("")}
      ${points.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="14" class="chit" data-pt="${i}"><title>${esc(p.label)}</title></circle>`).join("")}
    </svg>
    <figcaption class="small muted" data-cap>${esc(last.label)}</figcaption></figure>`;
}
function bindChart(id,points){
  const f=document.getElementById(id);if(!f)return;
  f.querySelectorAll("[data-pt]").forEach(c=>{const show=()=>{f.querySelector("[data-cap]").textContent=points[+c.dataset.pt].label};c.addEventListener("click",show);c.addEventListener("mouseenter",show)});
}

function renderGymHome(){
  const today=isoDate(new Date());
  const plans=gymPlans();
  const todays=dayInfo(today).list.filter(e=>e.t==="gym"&&e.ref).map(e=>e.ref);
  const d30=Date.now()-30*864e5;
  const n30=DB.workouts.filter(w=>w.startedAt>=d30).length;
  const names=allExerciseNames();
  if(!UI.exSel||!names.some(n=>nkey(n)===nkey(UI.exSel)))UI.exSel=names[0]||"";
  const hist=UI.exSel?exerciseHistory(UI.exSel):[];
  const exPts=hist.map(h=>({x:h.t,y:h.e,label:`${shortDate(h.date)}: ${h.best.w?fmtKg(h.best.w)+" кг × ":""}${h.best.r} → ≈${fmtKg(h.e)} кг`}));
  const bwAll=[...DB.bodyweight].sort((a,b)=>a.date.localeCompare(b.date));
  const bwPts=bwAll.map(b=>({x:parseISO(b.date).getTime(),y:b.kg,label:`${shortDate(b.date)}: ${fmtKg(b.kg)} кг`}));
  const bwLast=bwAll[bwAll.length-1];
  const bwWeekAgo=bwAll.filter(b=>b.date<=isoDate(new Date(Date.now()-7*864e5))).pop();
  const ws=[...DB.workouts].sort((a,b)=>b.startedAt-a.startedAt);
  $("#app").innerHTML=`
    <div class="row between"><h1>Зал</h1><span class="small muted">за 30 дней: ${n30} ${n30%10===1&&n30%100!==11?"тренировка":n30%10>=2&&n30%10<=4&&(n30%100<10||n30%100>=20)?"тренировки":"тренировок"}</span></div>
    <section class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Начать тренировку</h3>
      ${plans.length?plans.map(([k,p])=>`<button class="btn ${todays.includes(k)?"primary":""} block startw" data-start="${k}" style="text-align:left;display:flex;justify-content:space-between;gap:8px"><span>${esc(p.title)}</span><span class="small" style="opacity:.75;font-weight:500;white-space:nowrap">${todays.includes(k)?"сегодня":parsePlan(k).length+" упр."}</span></button>`).join("")
        :`<p class="small muted" style="margin:0">Нет планов тренировок. Во вкладке «Планы» создай план с цветом «Зал» и упражнениями вида <code>1. **Присед** — 4×5–8</code>.</p>`}
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Прогресс в упражнении</h3>
      ${names.length?`<select id="g-ex" aria-label="Упражнение">${names.map(n=>`<option ${nkey(n)===nkey(UI.exSel)?"selected":""}>${esc(n)}</option>`).join("")}</select>
        <div class="small muted">Расчётный максимум на 1 повтор по лучшему подходу</div>
        ${lineChart("ch-ex",exPts)}
        <ul class="hist">${hist.slice(-5).reverse().map(h=>`<li><span>${shortDate(h.date)}</span><span>${h.sets.map(s=>(s.w?fmtKg(s.w)+"×":"")+s.r).join(" · ")}</span></li>`).join("")}</ul>`
      :`<p class="small muted" style="margin:0">Появится после первой записанной тренировки.</p>`}
    </section>
    <section class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Вес тела</h3>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="bw-in" inputmode="decimal" placeholder="${bwLast?fmtKg(bwLast.kg):"кг"}" aria-label="Вес тела, кг" style="flex:1"><button class="btn primary" id="bw-add">Записать</button></div>
      ${bwLast?`<div class="small">Сейчас <b>${fmtKg(bwLast.kg)} кг</b>${bwWeekAgo&&bwWeekAgo!==bwLast?` · за неделю ${bwLast.kg-bwWeekAgo.kg<=0?"−":"+"}${fmtKg(Math.abs(bwLast.kg-bwWeekAgo.kg))} кг`:""}</div>`:""}
      ${bwPts.length?lineChart("ch-bw",bwPts):`<p class="small muted" style="margin:0">Взвешивайся утром натощак, 2–3 раза в неделю.</p>`}
    </section>
    <section style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:4px 2px 0">История</h3>
      ${ws.length?`<ul class="list">${ws.slice(0,UI.histAll?999:8).map(w=>`<li><button class="ev" data-wk="${w.id}" style="--c:var(--gym);grid-template-columns:86px 4px 1fr auto">
        <span class="t">${shortDate(w.date)}</span><span class="bar"></span>
        <span><span class="what">${esc(w.title)}</span><span class="note" style="display:block">${Math.round((w.finishedAt-w.startedAt)/60000)} мин · ${w.exercises.reduce((n,e)=>n+e.sets.length,0)} подходов</span></span><span class="chev">›</span></button></li>`).join("")}</ul>
        ${ws.length>8&&!UI.histAll?`<button class="link" id="h-all">Показать все (${ws.length})</button>`:""}`
      :`<div class="card empty">Пока пусто</div>`}
    </section>`;
  $("#app").querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startWorkout(b.dataset.start));
  const sel=$("#g-ex");if(sel)sel.onchange=()=>{UI.exSel=sel.value;render()};
  bindChart("ch-ex",exPts);bindChart("ch-bw",bwPts);

    const cur=DB.bodyweight.find(b=>b.date===today);
    if(cur){cur.kg=kg;cur.updated=Date.now()}else DB.bodyweight.push({id:uid(),date:today,kg,updated:Date.now()});
    save();render();toast("Записано");
  };
  const ha=$("#h-all");if(ha)ha.onclick=()=>{UI.histAll=true;render()};
  $("#app").querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>openWorkout(b.dataset.wk));
}

function openWorkout(id){
  const w=DB.workouts.find(x=>x.id===id);if(!w)return;
  const vol=w.exercises.reduce((n,e)=>n+e.sets.reduce((m,s)=>m+s.w*s.r,0),0);
  sheet(`<div class="head" style="--c:var(--gym)"><div class="sw"></div><div style="flex:1">
      <div class="tm">${shortDate(w.date)} · ${new Date(w.startedAt).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</div><h2 style="margin-top:2px">${esc(w.title)}</h2></div></div>
    <div class="stats"><div><b>${Math.round((w.finishedAt-w.startedAt)/60000)}</b><span>минут</span></div><div><b>${w.exercises.reduce((n,e)=>n+e.sets.length,0)}</b><span>подходов</span></div><div><b>${Math.round(vol).toLocaleString("ru-RU")}</b><span>кг объём</span></div></div>
    <ul class="hist">${w.exercises.map(e=>`<li><span>${esc(e.name)}</span><span>${e.sets.map(s=>(s.w?fmtKg(s.w)+"×":"")+s.r).join(" · ")}</span></li>`).join("")}</ul>
    <div id="wk-del"><button class="btn danger block" id="wk-delb">Удалить тренировку</button></div>`,()=>{
    $("#wk-delb").onclick=()=>{
      $("#wk-del").innerHTML=`<div class="confirm"><div>Удалить эту тренировку из истории?</div><div class="grid2"><button class="btn" id="c-no">Отмена</button><button class="btn danger" id="c-yes">Удалить</button></div></div>`;
      $("#c-no").onclick=()=>openWorkout(id);
      $("#c-yes").onclick=()=>{delItems("workouts",[id]);save();closeSheet();render();toast("Удалено")};
    };
  });
}

/* ================== СПИСКИ ==================
   Свои списки с цветом. DB.lists — списки, DB.listItems — пункты
   (отдельно, чтобы пункты с разных устройств объединялись по одному). */
const LCOLORS=["gym","food","study","uni","pool","rest","chores","drive"];
const OLD_KIND_COLOR={shop:"food",wish:"rest",plain:"study"};
const listColor=l=>l.color||OLD_KIND_COLOR[l.kind]||"uni";
const listItems=lid=>DB.listItems.filter(i=>i.listId===lid);
const fmtRub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const byItemOrder=(a,b)=>(a.done-b.done)||(a.created||0)-(b.created||0);
function tasksSwitch(){
  const v=UI.tview||"list";
  return `<div class="row" role="group" aria-label="Вид">${[["list","Список"],["month","Месяц"],["lists","Списки"]].map(([k,n])=>`<button class="pill" data-tv="${k}" id="v-${k}" aria-pressed="${v===k}">${n}</button>`).join("")}</div>`;
}
function bindTasksSwitch(){document.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{UI.tview=b.dataset.tv;UI.listOpen=null;render()})}
function toggleItem(id){const i=DB.listItems.find(x=>x.id===id);if(!i)return;i.done=!i.done;i.updated=Date.now();save();render()}

function renderLists(){
  if(UI.listOpen&&DB.lists.some(l=>l.id===UI.listOpen))return renderListOpen(UI.listOpen);
  const lists=[...DB.lists].sort((a,b)=>(a.created||0)-(b.created||0));
  $("#app").innerHTML=`
    <div class="row between"><h1>Задачи</h1>${tasksSwitch()}</div>
    ${lists.length?`<div class="ltiles">${lists.map(l=>{
      const it=listItems(l.id).sort(byItemOrder),open=it.filter(i=>!i.done);
      const shown=open.slice(0,6),more=open.length-shown.length,done=it.length-open.length;
      return `<div class="ltile" data-lo="${l.id}" style="--c:var(--${listColor(l)})" role="button" tabindex="0" aria-label="Открыть список ${esc(l.title)}">
        <div class="lt-head"><span class="lt-dot">${esc((l.title.trim()[0]||"•").toUpperCase())}</span><span class="lt-title">${esc(l.title)}</span></div>
        ${shown.length?`<ul class="lt-items">${shown.map(i=>`<li><button class="lt-check" data-tcheck="${i.id}" aria-label="Отметить: ${esc(i.text)}"></button><span>${esc(i.text)}</span></li>`).join("")}</ul>
          ${more>0?`<div class="lt-more">ещё ${more}</div>`:""}`
          :`<div class="lt-empty">${done?`Всё отмечено (${done})`:"Нет пунктов"}</div>`}
      </div>`}).join("")}</div>`
      :`<div class="card empty">Списков пока нет. Нажми «+», чтобы создать первый: покупки, желания, вещи в поездку — что угодно.</div>`}
    <button class="fab" id="l-new" aria-label="Новый список">+</button>`;
  bindTasksSwitch();
  const app=$("#app");
  app.querySelectorAll("[data-tcheck]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();toggleItem(b.dataset.tcheck)});
  app.querySelectorAll("[data-lo]").forEach(t=>{const go=()=>{UI.listOpen=t.dataset.lo;render();window.scrollTo(0,0)};t.onclick=go;t.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  $("#l-new").onclick=()=>openListEditor(null);
}

function colorPicker(sel){
  return `<div class="swatches" id="le-color" role="radiogroup" aria-label="Цвет">${LCOLORS.map(c=>`<button type="button" role="radio" data-c="${c}" aria-checked="${c===sel}" aria-label="${(TYPES[c]||[c])[0]}" style="--c:var(--${c})"></button>`).join("")}</div>`;
}

function itemRow(i,color){
  const link=safeUrl(i.link);
  const meta=[i.qty?esc(i.qty):"",i.price?fmtRub(i.price):"",i.note?esc(i.note):""].filter(Boolean).join(" · ");
  return `<li class="task ${i.done?"done":""}" style="--pc:var(--${color})">
    <button class="check ${i.done?"on":""}" data-itog="${i.id}" aria-label="${i.done?"Снять отметку":"Отметить"}"></button>
    <button class="txt" data-iedit="${i.id}"><div>${esc(i.text)}</div>${meta?`<div class="due">${meta}</div>`:""}</button>
    ${link?`<a class="x" href="${esc(link)}" target="_blank" rel="noopener" aria-label="Открыть ссылку" style="font-size:16px;text-decoration:none">↗</a>`:`<button class="x" data-idel="${i.id}" aria-label="Удалить">×</button>`}</li>`;
}

function renderListOpen(lid){
  const l=DB.lists.find(x=>x.id===lid),color=listColor(l);
  const it=listItems(lid).sort(byItemOrder);
  const open=it.filter(i=>!i.done),done=it.filter(i=>i.done);
  const known=[...new Set((l.history||[]).concat(it.map(i=>i.text)))].slice(-60);
  const sum=open.reduce((s,i)=>s+(i.price||0),0);
  $("#app").innerHTML=`
    <div class="row between"><button class="link" id="lb">‹ Все списки</button><button class="link" id="ll-edit">Изменить</button></div>
    <div class="row" style="gap:12px;flex-wrap:nowrap;--c:var(--${color})"><span class="lt-dot big">${esc((l.title.trim()[0]||"•").toUpperCase())}</span>
      <div><h1 style="font-size:26px">${esc(l.title)}</h1><div class="small muted">${open.length} осталось${done.length?`, ${done.length} отмечено`:""}${sum?` · всего ${fmtRub(sum)}`:""}</div></div></div>
    <form class="card addtask" id="li-add" style="display:grid">
      <input type="text" id="li-text" list="li-known" placeholder="Новый пункт" autocomplete="off">
      <button class="btn primary" type="submit">Добавить</button>
      <datalist id="li-known">${known.map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
    </form>
    <div class="small muted" style="margin-top:-6px">Можно сразу несколько через запятую: молоко, яйца, хлеб</div>
    ${open.length?`<ul class="list">${open.map(i=>itemRow(i,color)).join("")}</ul>`:it.length?"":`<div class="card empty">Пусто. Добавь первый пункт сверху.</div>`}
    ${done.length?`<div class="group-title">Отмечено (${done.length})</div><ul class="list">${done.map(i=>itemRow(i,color)).join("")}</ul>
      <button class="link" id="li-clear" style="color:var(--danger);align-self:flex-start">Убрать отмеченные</button>`:""}`;
  $("#lb").onclick=()=>{UI.listOpen=null;render()};
  $("#ll-edit").onclick=()=>openListEditor(lid);
  $("#li-add").onsubmit=ev=>{ev.preventDefault();const raw=$("#li-text").value.trim();if(!raw)return;
    const parts=raw.split(",").map(s=>s.trim()).filter(Boolean);
    const now=Date.now();parts.forEach((t,k)=>DB.listItems.push({id:uid(),listId:lid,text:t,done:false,created:now+k,updated:now+k}));
    save();render();setTimeout(()=>$("#li-text")&&$("#li-text").focus(),0)};
  const app=$("#app");
  app.querySelectorAll("[data-itog]").forEach(b=>b.onclick=()=>toggleItem(b.dataset.itog));
  app.querySelectorAll("[data-idel]").forEach(b=>b.onclick=()=>{delItems("listItems",[b.dataset.idel]);save();render()});
  app.querySelectorAll("[data-iedit]").forEach(b=>b.onclick=()=>openItemEditor(b.dataset.iedit));
  const cl=$("#li-clear");if(cl)cl.onclick=()=>{
    const ids=done.map(i=>i.id);
    l.history=[...new Set((l.history||[]).concat(done.map(i=>i.text)))].slice(-60);l.updated=Date.now();
    delItems("listItems",ids);save();render();toast("Убрано: "+ids.length)};
}

function openItemEditor(id){
  const i=DB.listItems.find(x=>x.id===id);if(!i)return;
  sheet(`<h2>Пункт</h2>
    <div class="field"><label for="ie-text">Название</label><input type="text" id="ie-text" value="${esc(i.text)}"></div>
    <div class="grid2"><div class="field"><label for="ie-qty">Сколько</label><input type="text" id="ie-qty" value="${esc(i.qty||"")}" placeholder="2 шт, 1 кг"></div>
      <div class="field"><label for="ie-price">Цена, ₽</label><input type="text" id="ie-price" inputmode="decimal" value="${i.price||""}"></div></div>
    <div class="field"><label for="ie-link">Ссылка</label><input type="text" id="ie-link" inputmode="url" autocapitalize="off" value="${esc(i.link||"")}" placeholder="https://"></div>
    <div class="field"><label for="ie-note">Заметка</label><input type="text" id="ie-note" value="${esc(i.note||"")}"></div>
    <button class="btn primary block" id="ie-save">Сохранить</button>
    <button class="btn danger block" id="ie-delb">Удалить пункт</button>`,()=>{
    $("#ie-save").onclick=()=>{
      i.text=$("#ie-text").value.trim()||i.text;i.note=$("#ie-note").value.trim();i.qty=$("#ie-qty").value.trim();
      i.price=parseNum($("#ie-price").value)||0;const u=$("#ie-link").value.trim();i.link=u&&!/^https?:\/\//i.test(u)?"https://"+u:u;
      i.updated=Date.now();save();closeSheet();render()};
    $("#ie-delb").onclick=()=>{delItems("listItems",[id]);save();closeSheet();render()};
  });
}

function openListEditor(lid){
  const l=lid?DB.lists.find(x=>x.id===lid):null;
  let color=l?listColor(l):LCOLORS[DB.lists.length%LCOLORS.length];
  sheet(`<h2>${l?"Список":"Новый список"}</h2>
    <div class="field"><label for="le-title">Название</label><input type="text" id="le-title" value="${esc(l?l.title:"")}" placeholder="Например, Покупки, Хочу, В поездку" autocomplete="off"></div>
    <div class="field"><label>Цвет</label>${colorPicker(color)}</div>
    <button class="btn primary block" id="le-save">${l?"Сохранить":"Создать"}</button>
    ${l?`<div id="le-del"><button class="btn danger block" id="le-delb">Удалить список</button></div>`:""}`,()=>{
    document.querySelectorAll("#le-color [data-c]").forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll("#le-color [data-c]").forEach(x=>x.setAttribute("aria-checked",x.dataset.c===color))});
    if(!l)setTimeout(()=>$("#le-title")&&$("#le-title").focus(),50);
    $("#le-save").onclick=()=>{
      const title=$("#le-title").value.trim();if(!title){$("#le-title").focus();toast("Впиши название");return}
      if(l){l.title=title;l.color=color;l.updated=Date.now()}
      else{const n={id:uid(),title,color,created:Date.now(),updated:Date.now()};DB.lists.push(n)}
      save();closeSheet();render()};
    const d=$("#le-delb");if(d)d.onclick=()=>{
      const n=listItems(lid).length;
      $("#le-del").innerHTML=`<div class="confirm"><div>Удалить «${esc(l.title)}»${n?` вместе с ${n} пунктами`:""}?</div><div class="grid2"><button class="btn" id="c-no">Отмена</button><button class="btn danger" id="c-yes">Удалить</button></div></div>`;
      $("#c-no").onclick=()=>openListEditor(lid);
      $("#c-yes").onclick=()=>{delItems("listItems",listItems(lid).map(i=>i.id));delItems("lists",[lid]);UI.listOpen=null;save();closeSheet();render();toast("Список удалён")};
    };
  });
}

/* ================== СИНХРОНИЗАЦИЯ ==================
   Настройки сервера хранятся отдельно от данных и в копию не попадают. */
const SYNC_KEY="moya-nedelya-sync";
let SYNC={url:"",token:"",lastAt:0,lastErr:"",busy:false};
try{Object.assign(SYNC,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"));SYNC.busy=false}catch(e){}
const syncOn=()=>!!(SYNC.url&&SYNC.token);
function saveSyncCfg(){try{const{busy,...rest}=SYNC;localStorage.setItem(SYNC_KEY,JSON.stringify(rest))}catch(e){}}
let syncTimer=null,syncAgain=false;
function scheduleSync(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),3000)}
async function syncNow(manual){
  if(!syncOn()){if(manual)toast("Сначала укажи адрес и токен");return false}
  if(SYNC.busy){syncAgain=true;return false}
  if(!navigator.onLine){SYNC.lastErr="Нет интернета";saveSyncCfg();refreshSyncStatus();return false}
  SYNC.busy=true;refreshSyncStatus();
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),12000);
  try{
    const r=await fetch(SYNC.url.replace(/\/+$/,"")+"/api/sync",{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+SYNC.token},body:JSON.stringify(DB)});
    if(r.status===401)throw new Error("Неверный токен");
    if(!r.ok)throw new Error("Сервер ответил "+r.status);
    const server=normalize(await r.json());
    const before=JSON.stringify(DB);
    mergeIn(server);saveLocal();
    SYNC.lastAt=Date.now();SYNC.lastErr="";
    if(JSON.stringify(DB)!==before&&!$("#layer").innerHTML)render();
    if(manual)toast("Синхронизировано");
    return true;
  }catch(e){
    SYNC.lastErr=e.name==="AbortError"?"Сервер не отвечает":(e.message==="Failed to fetch"||e.message==="Load failed"?"Сервер недоступен":e.message);
    if(manual)toast(SYNC.lastErr);
    return false;
  }finally{
    clearTimeout(to);SYNC.busy=false;saveSyncCfg();refreshSyncStatus();
    if(syncAgain){syncAgain=false;scheduleSync()}
  }
}
function syncStatusText(){
  if(!syncOn())return"Выключена. Приложение работает только с данными на этом устройстве.";
  if(SYNC.busy)return"Синхронизация…";
  const when=SYNC.lastAt?new Date(SYNC.lastAt).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"ещё не было";
  return (SYNC.lastErr?`Ошибка: ${SYNC.lastErr}. `:"")+`Последняя удачная: ${when}`;
}
function refreshSyncStatus(){const el=$("#sync-status");if(el){el.textContent=syncStatusText();el.style.color=SYNC.lastErr&&syncOn()?"var(--danger)":""}}
function syncCardHTML(){
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">Синхронизация</h3>
    <p class="small muted" style="margin:0">Свой сервер синхронизирует расписание и задачи между айфоном и макбуком. Без сервера всё работает как раньше.</p>
    <div class="field"><label for="s-url">Адрес сервера</label><input type="text" id="s-url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://имя-пк.tailnet.ts.net" value="${esc(SYNC.url)}"></div>
    <div class="field"><label for="s-token">Токен</label><input type="text" id="s-token" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="из файла .env на сервере" value="${esc(SYNC.token)}"></div>
    <div class="grid2"><button class="btn primary" id="s-save">Подключить</button><button class="btn" id="s-now" ${syncOn()?"":"disabled"}>Синхр. сейчас</button></div>
    <div class="small" id="sync-status"></div>
    ${syncOn()?`<button class="link" id="s-off" style="align-self:flex-start;color:var(--danger)">Отключить синхронизацию на этом устройстве</button>`:""}</div>`;
}
function bindSyncCard(){
  refreshSyncStatus();
  $("#s-save").onclick=async()=>{
    SYNC.url=$("#s-url").value.trim();SYNC.token=$("#s-token").value.trim();SYNC.lastErr="";saveSyncCfg();
    if(!syncOn()){toast("Заполни оба поля");return}
    const ok=await syncNow(true);render();
  };
  $("#s-now").onclick=()=>syncNow(true);
  const off=$("#s-off");if(off)off.onclick=()=>{SYNC={url:"",token:"",lastAt:0,lastErr:"",busy:false};saveSyncCfg();render();toast("Синхронизация отключена")};
}

/* ================== СТАРТ ================== */
render();
// обновлять «сейчас» раз в минуту и при возврате в приложение
setInterval(()=>{if(UI.tab==="sched"&&!$("#layer").innerHTML)render()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(!$("#layer").innerHTML)render();syncNow(false)}});
window.addEventListener("online",()=>syncNow(false));
syncNow(false);

if("serviceWorker" in navigator&&location.protocol==="https:"){
  try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
